# Dependabot configuration for CampusBites multi-app Flutter project
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Customer App
  - package-ecosystem: "pub"
    directory: "/apps/customer_app"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "customer-app"

  # Vendor App  
  - package-ecosystem: "pub"
    directory: "/apps/vendor_app"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "vendor-app"

  # Admin App
  - package-ecosystem: "pub"
    directory: "/apps/admin_app"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "admin-app"

  # Core Package
  - package-ecosystem: "pub"
    directory: "/packages/core"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "core-package"

  # UI Package
  - package-ecosystem: "pub"
    directory: "/packages/ui"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ui-package"

  # Utils Package
  - package-ecosystem: "pub"
    directory: "/packages/utils"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "utils-package"
