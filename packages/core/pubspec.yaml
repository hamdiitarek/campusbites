name: core
description: "Shared core functionality for Campus Bites apps"
version: 0.0.1
homepage:

environment:
  sdk: ^3.6.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.2.5
  firebase_storage: ^12.4.6
  cloud_functions: ^5.2.0
  provider: ^6.1.1
  flutter_local_notifications: ^17.2.1+2
  cached_network_image: ^3.2.3
  intl: ">=0.18.0 <0.21.0"
  timeago: ^3.3.0
  image_picker: ^1.0.4
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

